<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Common Errors in English — Study &amp; Exam App</title>
<meta name="theme-color" content="#2b3350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href='data:application/manifest+json,{"name":"Common%20Errors%20in%20English","short_name":"GrammarFix","start_url":".","display":"standalone","background_color":"%23EFEAE0","theme_color":"%232b3350","icons":[]}'>
<style>
:root{
  --paper:#EFEAE0; --paper-2:#E4DDCC; --ink:#242A3B; --ink-soft:#565C72;
  --rule:#C7BFA6; --ochre:#B4802E; --ochre-deep:#8C5F1E;
  --right:#2F6B4F; --right-bg:#E4EFE7; --wrong:#A23B34; --wrong-bg:#F3E4E1;
  --card:#F8F5EC; --shadow:rgba(36,42,59,.14);
  --serif: "Iowan Old Style","Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Avenir Next", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --paper:#1B1E29; --paper-2:#20242F; --ink:#EDE7D8; --ink-soft:#B9B4A4;
    --rule:#3B3F4E; --card:#22262F; --right-bg:#1E2A22; --wrong-bg:#2E1F1E; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1E29; --paper-2:#20242F; --ink:#EDE7D8; --ink-soft:#B9B4A4;
  --rule:#3B3F4E; --card:#22262F; --right-bg:#1E2A22; --wrong-bg:#2E1F1E; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--ochre); color:#fff; }
:lang(bn){ font-family: "Noto Sans Bengali", "Kohinoor Bangla", var(--sans); }
:lang(hi){ font-family: "Noto Sans Devanagari", var(--sans); }

header.topbar{ position:sticky; top:0; z-index:40; padding-top:var(--safe-top); background:var(--paper); border-bottom:1px solid var(--rule); }
.topbar-inner{ display:flex; align-items:center; gap:.5rem; padding:.65rem .7rem; }
.brand{ display:flex; align-items:center; gap:.5rem; flex:1; min-width:0; }
.brand .mark{ font-family:var(--serif); font-weight:700; font-size:1.2rem; color:var(--ochre-deep); border:1.5px solid var(--ochre-deep); width:2rem; height:2rem; border-radius:3px; display:flex; align-items:center; justify-content:center; flex:none;}
.brand .title{ font-family:var(--serif); font-size:.98rem; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.brand .sub{ font-size:.65rem; color:var(--ink-soft); }
button.iconbtn{ background:none; border:1px solid var(--rule); color:var(--ink); border-radius:3px; width:2rem; height:2rem; display:flex; align-items:center; justify-content:center; font-size:1rem; cursor:pointer; flex:none;}
button.iconbtn:active{ background:var(--paper-2); }

.langseg{ display:flex; border:1px solid var(--ochre-deep); border-radius:4px; overflow:hidden; flex:none; }
.langseg button{ background:none; border:none; color:var(--ochre-deep); font-family:var(--sans); font-size:.68rem; font-weight:700; padding:.4rem .4rem; cursor:pointer; border-left:1px solid var(--ochre-deep); }
.langseg button:first-child{ border-left:none; }
.langseg button[aria-current="true"]{ background:var(--ochre-deep); color:#fff; }

nav.modes{ display:flex; gap:0; border-top:1px solid var(--rule); overflow-x:auto; scrollbar-width:none; }
nav.modes::-webkit-scrollbar{display:none;}
nav.modes button{ flex:none; background:none; border:none; color:var(--ink-soft); font-family:var(--sans); font-size:.8rem; padding:.6rem .85rem; cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;}
nav.modes button[aria-selected="true"]{ color:var(--ochre-deep); border-bottom-color:var(--ochre-deep); font-weight:700; }

.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:49; opacity:0; pointer-events:none; transition:opacity .2s;}
.scrim.show{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; background:var(--card); z-index:50; transform:translateX(-104%); transition:transform .25s ease; overflow-y:auto; padding-top:calc(var(--safe-top) + .6rem); padding-bottom:calc(var(--safe-bottom) + 1rem); border-right:1px solid var(--rule);}
.drawer.open{ transform:translateX(0); }
.drawer h3{ font-family:var(--serif); font-size:.92rem; margin:1rem 1rem .35rem; color:var(--ochre-deep); border-bottom:1px solid var(--rule); padding-bottom:.3rem;}
.drawer .catbtn{ display:flex; justify-content:space-between; align-items:baseline; width:100%; text-align:left; background:none; border:none; padding:.55rem 1rem; font-family:var(--sans); font-size:.86rem; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--paper-2);}
.drawer .catbtn small{ color:var(--ink-soft); font-size:.7rem;}
.drawer .catbtn[data-active="true"]{ background:var(--paper-2); font-weight:700; color:var(--ochre-deep); }
.drawer-close{ display:flex; justify-content:flex-end; padding:0 .8rem;}

main{ max-width:760px; margin:0 auto; padding:1rem .9rem 3rem; }
.hero{ padding:1.1rem 0 1.3rem; border-bottom:1px solid var(--rule); margin-bottom:1.1rem; }
.hero h1{ font-family:var(--serif); font-size:1.45rem; margin:.1rem 0 .3rem; line-height:1.3;}
.hero p{ margin:.2rem 0; color:var(--ink-soft); font-size:.9rem; line-height:1.55;}
.hero .stats{ display:flex; gap:1.1rem; margin-top:.8rem; flex-wrap:wrap;}
.hero .stat b{ font-family:var(--serif); font-size:1.2rem; color:var(--ochre-deep); display:block;}
.hero .stat span{ font-size:.66rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}

.catgrid{ display:grid; grid-template-columns:1fr; gap:.6rem; }
.catcard{ background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:.8rem .95rem; cursor:pointer; text-align:left; font-family:var(--sans); color:var(--ink);}
.catcard .num{ font-family:var(--serif); color:var(--ochre-deep); font-size:.76rem; }
.catcard h4{ margin:.15rem 0 .2rem; font-family:var(--serif); font-size:1rem; font-weight:600;}
.catcard p{ margin:0; font-size:.8rem; color:var(--ink-soft); line-height:1.45;}
.catcard .count{ font-size:.68rem; color:var(--ochre-deep); margin-top:.35rem; display:block;}

.backrow{ display:flex; align-items:center; gap:.5rem; margin-bottom:.7rem;}
.backrow button{ background:none; border:none; color:var(--ochre-deep); font-size:.84rem; font-weight:700; cursor:pointer; padding:.2rem 0;}
.section-title{ font-family:var(--serif); font-size:1.25rem; margin:.1rem 0 .15rem;}
.section-sub{ color:var(--ink-soft); font-size:.84rem; margin-bottom:.6rem; line-height:1.5;}
.notebox{ background:var(--right-bg); border-left:3px solid var(--right); padding:.6rem .8rem; border-radius:3px; font-size:.82rem; margin-bottom:.9rem; line-height:1.55;}
.notebox b{ color:var(--right); display:block; margin-bottom:.25rem;}
.pairlist{ display:flex; flex-direction:column; gap:.5rem; }
.pair{ background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:.65rem .8rem;}
.pair .w, .pair .r{ display:flex; gap:.5rem; font-size:.89rem; line-height:1.4; }
.pair .tag{ flex:none; font-size:.66rem; font-weight:700; letter-spacing:.03em; padding:.05rem .4rem; border-radius:2px; height:fit-content; margin-top:.1rem;}
.pair .w .tag{ background:var(--wrong-bg); color:var(--wrong); }
.pair .r .tag{ background:var(--right-bg); color:var(--right); }
.pair .w{ color:var(--ink-soft); margin-bottom:.25rem;}
.pair .r{ color:var(--ink); font-weight:600;}

.qcard{ background:var(--card); border:1px solid var(--rule); border-radius:5px; padding:1rem; }
.qmeta{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--ink-soft); margin-bottom:.5rem;}
.qprompt{ font-family:var(--serif); font-size:1.05rem; line-height:1.5; margin-bottom:.9rem;}
.qoptions{ display:flex; flex-direction:column; gap:.5rem; }
.qopt{ text-align:left; background:var(--paper); border:1px solid var(--rule); border-radius:4px; padding:.65rem .8rem; font-size:.9rem; cursor:pointer; color:var(--ink); font-family:var(--sans); line-height:1.4;}
.qopt:active{ background:var(--paper-2); }
.qopt.correct{ background:var(--right-bg); border-color:var(--right); color:var(--right); font-weight:700;}
.qopt.wrong{ background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong); }
.qopt[disabled]{ cursor:default; }
.qfoot{ display:flex; justify-content:space-between; align-items:center; margin-top:1rem; gap:.6rem;}
.btn{ background:var(--ochre-deep); color:#fff; border:none; border-radius:4px; padding:.6rem 1.1rem; font-size:.84rem; font-weight:700; cursor:pointer; font-family:var(--sans);}
.btn.ghost{ background:none; color:var(--ochre-deep); border:1px solid var(--ochre-deep); }
.btn[disabled]{ opacity:.4; }
.progresswrap{ height:5px; background:var(--paper-2); border-radius:3px; overflow:hidden; margin-bottom:.9rem;}
.progressbar{ height:100%; background:var(--ochre-deep); width:0%; transition:width .2s; }
.explain{ margin-top:.8rem; font-size:.82rem; background:var(--paper); border-radius:4px; padding:.6rem .8rem; color:var(--ink-soft); display:none;}
.explain.show{ display:block; }
.explain b{ color:var(--ink); }

.setup-grid{ display:flex; flex-direction:column; gap:.9rem; }
.field label{ display:block; font-size:.78rem; color:var(--ink-soft); margin-bottom:.35rem;}
.chiprow{ display:flex; flex-wrap:wrap; gap:.4rem; }
.chip{ border:1px solid var(--rule); background:var(--card); border-radius:20px; padding:.35rem .8rem; font-size:.76rem; cursor:pointer; color:var(--ink);}
.chip[data-active="true"]{ background:var(--ochre-deep); border-color:var(--ochre-deep); color:#fff; }
input[type=number], select{ background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:.5rem .6rem; color:var(--ink); font-family:var(--sans); font-size:.88rem; width:100%;}

.resultbox{ text-align:center; padding:1.4rem .8rem; }
.resultbox .score{ font-family:var(--serif); font-size:2.9rem; color:var(--ochre-deep); }
.resultbox .label{ color:var(--ink-soft); font-size:.84rem; margin-bottom:1rem;}
.reviewlist{ text-align:left; display:flex; flex-direction:column; gap:.55rem; margin-top:1rem;}
.reviewlist>b{ display:block; margin-bottom:.2rem; }
.reviewitem{ border:1px solid var(--rule); border-radius:4px; padding:.6rem .75rem; font-size:.84rem; background:var(--card);}
.reviewitem.bad{ border-left:3px solid var(--wrong); }
.reviewitem.good{ border-left:3px solid var(--right); }

.hidden{ display:none !important; }
footer.credit{ text-align:center; color:var(--ink-soft); font-size:.68rem; padding:1.5rem 1rem calc(1.5rem + var(--safe-bottom)); line-height:1.5;}
</style>
</head>

<header class="topbar">
  <div class="topbar-inner">

            bn:"প্রতিটি সাধারণ ইংরেজি ভুল, ক্লাসিক ব্যাকরণ গ্রন্থ অনুযায়ী শ্রেণীবদ্ধ — বিশেষ্য, বিশেষণ, সর্বনাম, ক্রিয়া, ক্রিয়া বিশেষণ, পদান্বয়ী অব্যয়, সংযোজক অব্যয় ও বাগ্‌ধারা — সংশোধন ও তার কারণসহ।"},

 items:[

{id:"v-passive", num:"503", en:"Passive misused for Active", hi:"कर्मवाच्य का गलत प्रयोग (Active की जगह)", bn:"কর্মবাচ্যের ভুল ব্যবহার (কর্তৃবাচ্যের বদলে)",
 desc:{en:"Intransitive or stative verbs (belong, seem, die, issue) are wrongly turned into the passive voice.",
       hi:"अकर्मक या स्थिति-सूचक क्रियाओं (belong, seem, die, issue) को गलती से कर्मवाच्य (passive) बना दिया जाता है।",
       bn:"অকর্মক বা অবস্থাসূচক ক্রিয়া (belong, seem, die, issue) ভুলবশত কর্মবাচ্যে পরিণত করা হয়।"},
 notes:[{en:"Adjectives are generally followed by the active infinitive, not the passive one — 'hard to believe', not 'hard to be believed'.",
        hi:"विशेषण के बाद सामान्यतः कर्ताकारक infinitive आता है, कर्मवाच्य नहीं — 'hard to believe', 'hard to be believed' नहीं।",
        bn:"বিশেষণের পরে সাধারণত কর্তৃবাচ্য infinitive বসে, কর্মবাচ্য নয় — 'hard to believe', 'hard to be believed' নয়।"}],

 notes:[{en:"See/look at: 'see' is effortless perception; 'look at' implies deliberate attention.", hi:"See/look at: 'see' सहज अनुभूति है; 'look at' सचेत ध्यान दर्शाता है।", bn:"See/look at: 'see' হলো সহজাত উপলব্ধি; 'look at' মানে সচেতন মনোযোগ।"},
        {en:"Hear/listen: 'hear' is passive; 'listen' implies attention.", hi:"Hear/listen: 'hear' निष्क्रिय है; 'listen' ध्यान देना दर्शाता है।", bn:"Hear/listen: 'hear' নিষ্ক্রিয়; 'listen' মানে মনোযোগ দেওয়া।"},
        {en:"Make a mistake, do wrong/harm, commit a crime/fault — these verb-noun pairs are fixed.", hi:"Make a mistake, do wrong/harm, commit a crime/fault — ये क्रिया-संज्ञा जोड़े निश्चित हैं।", bn:"Make a mistake, do wrong/harm, commit a crime/fault — এই ক্রিয়া-বিশেষ্য জোড়গুলি নির্দিষ্ট।"}],

{id:"v-tense", num:"505", en:"Use of Tense", hi:"काल (Tense) का प्रयोग", bn:"কাল (Tense) এর ব্যবহার",
 desc:{en:"Continuous / simple / perfect tenses are swapped incorrectly, especially with 'for/since', reported speech, and conditional 'if'.",
       hi:"निरंतर/सामान्य/पूर्ण काल (continuous/simple/perfect tense) का गलत प्रयोग, विशेषकर 'for/since', अप्रत्यक्ष कथन और 'if' के साथ।",
       bn:"নিরবচ্ছিন্ন/সাধারণ/পুরাঘটিত কাল ভুলভাবে ব্যবহৃত হয়, বিশেষত 'for/since', পরোক্ষ উক্তি ও শর্তসাপেক্ষ 'if' এর সঙ্গে।"},
 notes:[{en:"An action continuing from the past up to now, with 'for/since', needs the present perfect (continuous): 'has been raining for a week', not 'is raining for a week'.",
        hi:"अतीत से अब तक जारी क्रिया, 'for/since' के साथ, present perfect (continuous) लेती है: 'has been raining for a week', 'is raining for a week' नहीं।",
        bn:"অতীত থেকে এখন পর্যন্ত চলতে থাকা কাজ, 'for/since' সহ, present perfect (continuous) নেয়: 'has been raining for a week', 'is raining for a week' নয়।"},
        {en:"'It is high time' is followed by a past-tense verb even though the meaning is present/future.",
        hi:"'It is high time' के बाद past tense क्रिया आती है, यद्यपि अर्थ वर्तमान/भविष्य का होता है।",
        bn:"'It is high time' এর পরে past tense ক্রিয়া বসে, যদিও অর্থ বর্তমান/ভবিষ্যৎ।"}],

 ["It is raining for a week.","It has been raining for a week."],
 ["He is suffering for three days.","He has been suffering for three days."],
 ["The earth is moving round the sun.","The earth moves round the sun."],
 ["I have arrived yesterday.","I arrived yesterday."],

 ["I hope he would do well.","I hope he will do well."],
 ["When you will come here, I shall go with you.","When you come here, I shall go with you."],
 ["The crops will die before the rains will fall.","The crops will die before the rains fall."],
 ["Should you pass he will be happy.","Should you pass he would be happy."],
 ["If I should meet a tiger I shall run.","If I should meet a tiger I should run."],
 ["He speaks as if he knows the subject well.","He speaks as if he knew the subject well."],
 ["It is high time government do something in this matter.","It is high time government did something in this matter."],
 ["I am living in Suri for a long time.","I have been living at Suri for a long time."],
 ["Forty years passed since India has become free.","Forty years have passed since India became free."],

 ["When I returned home, he still didn't finish the job.","When I returned home, he still hadn't finished the job."],
 ["As we discussed the matter the phone rang.","As we were discussing the matter, the phone rang."],
 ["He assured he will come.","He assured he would come."],

{id:"v-interrog", num:"506", en:"Interrogative Form (indirect questions)", hi:"प्रश्नवाचक रूप (अप्रत्यक्ष प्रश्न)", bn:"প্রশ্নবোধক রূপ (পরোক্ষ প্রশ্ন)",

       hi:"अप्रत्यक्ष प्रश्न में शब्द-क्रम कथन जैसा हो जाता है (कर्ता क्रिया से पहले) — कोई उलटफेर (inversion) नहीं होता।",

{id:"v-inf-ger", num:"507", en:"Infinitive vs Gerund", hi:"Infinitive बनाम Gerund", bn:"Infinitive বনাম Gerund",
 desc:{en:"Certain verbs and prepositions must be followed by a gerund (-ing), not a to-infinitive, and vice versa.",
       hi:"कुछ क्रियाओं और पूर्वसर्गों के बाद gerund (-ing) आना चाहिए, to-infinitive नहीं — और कुछ में इसका उलटा।",
       bn:"কিছু ক্রিয়া ও preposition এর পরে gerund (-ing) বসাতে হয়, to-infinitive নয় — কিছুতে এর উল্টো।"},
 notes:[{en:"'For' + gerund shows cause, not purpose: 'He was punished for going there' — purpose needs the plain infinitive.",
        hi:"'For' + gerund कारण दर्शाता है, उद्देश्य नहीं: 'He was punished for going there' — उद्देश्य के लिए सामान्य infinitive चाहिए।",
        bn:"'For' + gerund কারণ বোঝায়, উদ্দেশ্য নয়: 'He was punished for going there' — উদ্দেশ্য বোঝাতে সাধারণ infinitive লাগে।"}],

function buildChrome(){
  document.getElementById("brandTitle").textContent = "Common Errors in English";
  document.getElementById("brandSub").textContent = t(UI.brandSub);
  document.getElementById("drawerHeading").textContent = t(UI.drawerHeading);
  document.getElementById("footerCredit").textContent = t(UI.footer);
  modeNav.innerHTML = `
    <button data-mode="home">${t(UI.navHome)}</button>
    <button data-mode="study">${t(UI.navStudy)}</button>

    <button data-mode="about">${t(UI.navAbout)}</button>`;
  [...modeNav.querySelectorAll("button")].forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.mode === state.mode ? "true" : "false");
    b.onclick = ()=> setMode(b.dataset.mode);
  });
  [...langSeg.querySelectorAll("button")].forEach(b=>{
    b.setAttribute("aria-current", b.dataset.l === state.lang ? "true" : "false");
  });
  buildDrawer();
}

function buildDrawer(){
  drawerList.innerHTML = "";
  CATS.forEach(cat=>{
    const b = document.createElement("button");
    b.className = "catbtn";
    b.dataset.cat = cat.id;
    b.innerHTML = `<span>${esc(cat.num)}. ${esc(t({en:cat.en,hi:cat.hi,bn:cat.bn}))}</span><small>${cat.items.length}</small>`;
    b.onclick = ()=>{ closeDrawer(); openCategory(cat.id); };
    drawerList.appendChild(b);
  });
}

function openDrawer(){ drawer.classList.add("open"); scrim.classList.add("show"); }
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("show"); }
menuBtn.onclick = openDrawer;
drawerClose.onclick = closeDrawer;
scrim.onclick = closeDrawer;
themeBtn.onclick = ()=>{
  const root = document.documentElement;
  root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
};
langSeg.querySelectorAll("button").forEach(b=>{
  b.onclick = ()=>{
    state.lang = b.dataset.l;
    buildChrome();
    render();
  };
});

function setMode(mode){
  state.mode = mode;
  buildChrome();
  render();
  window.scrollTo({top:0, behavior:"instant"});
}
function openCategory(id){ state.currentCat = id; setMode("study"); }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildOptions(q){
  const distractorsPool = shuffle(QUESTIONS.filter(x=>x!==q));
  const opts = [ {text:q.right, correct:true}, {text:q.wrong, correct:false} ];
  let i=0;
  while(opts.length<4 && i<distractorsPool.length){
    const cand = distractorsPool[i].wrong;
    if(!opts.some(o=>o.text===cand)) opts.push({text:cand, correct:false});
    i++;
  }
  return shuffle(opts);
}

function startQuiz(catId){
  const pool = catId ? QUESTIONS.filter(q=>q.cat===catId) : QUESTIONS;
  state.quiz.queue = shuffle(pool).slice(0, Math.min(pool.length, 200));
  state.quiz.pos = 0; state.quiz.score = 0; state.quiz.wrongLog = [];
  state.mode = "quiz";
  buildChrome();
  renderQuizQuestion();
}
